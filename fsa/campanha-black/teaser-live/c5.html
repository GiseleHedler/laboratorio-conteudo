<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Corm;src:url(fonts/corm-normal-600.woff2);font-weight:300 700}
@font-face{font-family:Corm;src:url(fonts/corm-italic-600.woff2);font-style:italic;font-weight:300 700}
@font-face{font-family:Archivo;src:url(fonts/archivo.woff2);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:transparent}
.f{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:Archivo}
.cap{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:960px;top:230px;;background:rgba(15,1,9,.72);padding:26px 44px;border-radius:28px;text-align:center;font-weight:800;font-size:64px;line-height:1.12;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.85)}
.cap em{font-family:Corm;font-style:italic;font-weight:600;color:#F1D27F;font-size:78px}
.dark{background:radial-gradient(90% 55% at 80% 0%,rgba(199,62,92,.35),transparent 60%),linear-gradient(180deg,#1d0616,#0f0109);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fbf6ef}
.big{font-family:Corm;font-weight:600;font-size:150px;line-height:1}
.big em{font-style:italic;color:#E9C56A}
.hoje{font-weight:900;font-size:300px;letter-spacing:.02em;color:#fbf6ef;text-shadow:0 0 80px rgba(220,68,124,.7)}
.hoje span{color:#DC447C}
.k{font-weight:700;letter-spacing:.3em;font-size:32px;color:#E0B64F}
.end img{height:120px;position:absolute;top:300px;left:50%;transform:translateX(-50%)}
.h{font-family:Corm;font-weight:600;font-size:260px;line-height:.9;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1;text-shadow:0 0 70px rgba(224,182,79,.3)}
.ao{display:inline-flex;align-items:center;gap:16px;border:2px solid rgba(224,182,79,.8);border-radius:999px;padding:20px 40px;font-weight:700;letter-spacing:.24em;font-size:30px}
.ao i{width:18px;height:18px;border-radius:50%;background:#DC447C;box-shadow:0 0 20px #DC447C}
</style></head><body><div class="f"><div class="cap">Hoje, quem conta<br><em>é ele.</em></div></div></body></html>
