<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Arch;src:url(file:///root/.fonts/archivo.ttf)}
@font-face{font-family:ArchB;src:url(file:///root/.fonts/archivoblack.ttf)}
html,body{margin:0}
#n{width:1080px;height:1350px;position:relative;overflow:hidden;background:url(gabriel-serio-cheia.jpg) center/cover}
#n:after{content:"";position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(to top,rgba(10,6,8,.85),transparent)}
.tit{position:absolute;top:70px;left:0;right:0;text-align:center;font-family:ArchB;color:#E3262F;line-height:.95;letter-spacing:.01em}
.tit .a{font-size:118px}.tit .b{font-size:96px}
.base{position:absolute;left:70px;right:70px;bottom:60px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.base img{height:56px}
.base span{font-family:Arch;font-weight:700;font-size:22px;letter-spacing:.2em;color:#ece4d8;text-transform:uppercase}
</style></head><body>
<div id="n">
 <div class="tit"><div class="a">NOTA DE</div><div class="b">ESCLARECIMENTO</div></div>
 <div class="base"><img src="logo-fsa-escuro.png"><span>Leia na legenda</span></div>
</div></body></html>
